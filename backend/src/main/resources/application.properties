# ===========================================================================
#  Configuration du backend Quarkus — mini-WMS
#  Les ${VAR:defaut} sont surchargées par les variables d'environnement
#  (docker-compose). Sinon le défaut s'applique (pratique en local).
# ===========================================================================

# --- Base de données PostgreSQL ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:wms}
quarkus.datasource.password=${DB_PASSWORD:wms}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/wmsdb}

# Hibernate : met à jour le schéma à partir des entités ("update" = persistant).
#  change update en validate :
# on retire à Hibernate le droit de modifier la base — désormais Hibernate vérifie seulement que tes entités correspondent au schéma. C'est Liquibase qui écrira.)

# quarkus.hibernate-orm.database.generation=validate     # docker compose up -d --build backendexiste dans la version3.17
quarkus.hibernate-orm.schema-management.strategy=validate

# --- Migrations Liquibase : le schema est du CODE versionne (db/changeLog.xml) ---
quarkus.liquibase.migrate-at-start=true

# --- Colonnes JSON/JSONB (champs_custom) : mapper DEDIE a la base ---
#  Par defaut, Hibernate emprunterait l'ObjectMapper des endpoints REST pour lire/ecrire
#  le JSONB. Or cet ObjectMapper est configure pour l'API (dates ISO, etc.) : un simple
#  reglage cosmetique de l'API pourrait alors changer le FORMAT STOCKE en base -> Quarkus
#  refuse de demarrer plutot que de risquer une corruption silencieuse des donnees.
#  "ignore" = Hibernate utilise SON PROPRE mapper, independant de REST. C'est la valeur
#  recommandee (et le futur defaut de Quarkus) : le format en base ne bouge plus si on
#  retouche la serialisation de l'API.
quarkus.hibernate-orm.mapping.format.global=ignore

# --- CORS (navigateur Angular / Flutter Web) ---
#   quarkus.http.cors=true existe dans la version3.17
#   DEV : on autorise TOUT localhost via une regex (entre /.../), car Flutter web
#   prend un port ALEATOIRE a chaque run -> plus besoin de --web-port ni de lister les ports.
#   PROD : surcharger CORS_ORIGINS avec le vrai domaine du front (JAMAIS la regex en prod).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:/http://localhost:.*/}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,content-type,authorization

# --- Documentation API (Swagger UI dispo même en prod) ---
quarkus.swagger-ui.always-include=true

# --- Serveur HTTP ---
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
