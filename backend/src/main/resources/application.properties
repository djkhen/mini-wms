# ===========================================================================
#  Configuration du backend Quarkus — mini-WMS
#  Les ${VAR:defaut} sont surchargées par les variables d'environnement
#  (docker-compose). Sinon le défaut s'applique (pratique en local).
# ===========================================================================

# --- Base de données PostgreSQL ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:wms}
quarkus.datasource.password=${DB_PASSWORD:wms}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/wmsdb}

# Hibernate : met à jour le schéma à partir des entités ("update" = persistant).
quarkus.hibernate-orm.database.generation=update

# --- CORS (navigateur Angular / Flutter Web) ---
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:8090,http://localhost:5000,http://localhost:5001}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,content-type,authorization

# --- Documentation API (Swagger UI dispo même en prod) ---
quarkus.swagger-ui.always-include=true

# --- Serveur HTTP ---
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
